apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-webhook
  labels:
    app.kubernetes.io/component: webhook
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/component: webhook
    spec:
      serviceAccountName: ai-collector
      containers:
      - name: webhook
        image: webhook:latest
        imagePullPolicy: IfNotPresent
        args:
          - "-config"
          - "/etc/config/webhook.yaml"
          - "-port"
          - "8080"
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: TZ
          value: "UTC"
        envFrom:
        - secretRef:
            name: ai-webhook
        volumeMounts:
        - name: config
          mountPath: /etc/config
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: ai-metrics