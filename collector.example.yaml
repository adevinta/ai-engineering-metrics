# Configuration for AI Engineering Metrics pipeline
# This file follows the current schema where everything is organized into pipelines

pipelines:
  - # Pipeline 1: Main AI metrics collection pipeline
    collectors:
      - name: bedrock-s3 # of the tool as it appears in GetDX
        type: bedrock
        enabled: true
        config:
          bucket: my-bedrock-logs-bucket
          prefix: bedrock-logs/
          # local_path: /tmp/bedrock-logs  # Optional: local directory for temporary file storage
        user_mapping:
          type: passthrough
          config: {}
          # Alternative user mapping options:
          # type: static
          # config:
          #   session-123: user@example.com
          #   session-456: another@example.com
          # type: regex
          # config:
          #   regex: 'session-(.+)'
          #   replacement: 'user-$1@example.com'

      # GitHub AI Readiness Collector - scans repositories for AI configuration files
      - name: github-ai-readiness
        type: github
        enabled: false  # Enable when ready to use
        config:
          github_token: ${env.GITHUB_TOKEN}  # GitHub Personal Access Token with repo read permissions

          # SCANNING OPTIONS (choose one or combine):

          # Option 1: Scan specific repositories (precise control)
          repositories:
            - "adevinta/ai-engineering-metrics"
            - "adevinta/data-platform"
            - "your-org/your-repo"

          # Option 2: Scan all repositories user has direct access to
          scan_all_repos: false

          # Option 3: Scan ALL repositories from ALL organizations user belongs to (most comprehensive)
          # This discovers organizations first, then scans all repos within them
          scan_all_organizations: false

          # Optional: Filter organizations when using scan_all_repos or scan_all_organizations
          # (only scan repos from these organizations)
          organization_filter:
            - "adevinta"
            - "your-org"

          # Optional: AI indicator files to look for (defaults to CLAUDE.md variations)
          ai_indicators:
            - "CLAUDE.md"
            - "claude.md"
            - "Claude.md"
        user_mapping:
          type: passthrough
          config: {}

    publishers:
      - name: getdx
        type: getdx
        enabled: true
        config:
          api_url: https://api.getdx.com/v1/metrics
          api_key: ${GETDX_API_KEY}
          tools:
          - claude
          - ai-readiness          # Individual repository AI readiness status
          - ai-readiness-summary  # Organizational AI readiness percentages

    # User filtering configuration
    users:
      type: static
      config:
        user_ids:
          - user@example.com      # Include specific users
          - admin@example.com
          - service-account-123
          # Add more user IDs as needed
      # Alternatively, use GetDX API to get the list of users
      # type: getdx
      # config:
      #  api_key: ${GETDX_WEB_API_KEY}

