# AI Engineering Metrics Collector Configuration Example
# This example shows how to collect Claude usage metrics and AI readiness metrics

pipelines:
  # Pipeline 1: Claude Usage Metrics with User Filtering
  - users:
      type: getdx
      config:
        api_key: ${env.GETDX_WEB_API_KEY}
    collectors:
      - name: claude
        type: bedrock
        enabled: true
        config:
          bucket: my-bedrock-logs-bucket
          prefix: AWSLogs/123456789012/BedrockModelInvocationLogs/us-east-1/
          costs:
            region: us-east-1
            discount: 0%
        user_mapping:
          type: regex
          config:
            regex: "arn:aws:sts::123456789012:assumed-role/MyRole/(.*@company.com)"
            replacement: "$1"
    publishers:
      - type: getdx
        config:
          api_base_url: https://api.getdx.com
          api_token: ${env.GETDX_API_KEY}
          tools:
            - claude

  # Pipeline 2: AI Readiness Metrics (no user filtering needed)
  - collectors:
      - name: github-ai-readiness
        type: github
        enabled: true
        config:
          app_id: ${env.GITHUB_APP_ID}
          private_key: ${env.GITHUB_PRIVATE_KEY}
          scan_all_organizations: true
          organization_filter:
            - "my-org"
        user_mapping:
          type: passthrough
          config: {}
    publishers:
      - type: getdx-ai-enabled-repos
        config:
          api_base_url: https://api.getdx.com
          api_token: ${env.GETDX_API_KEY}
          tools:
            - ai-readiness
            - ai-readiness-summary

# Alternative user filtering options for Pipeline 1:
